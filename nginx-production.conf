# ReputationManager - Nginx Production Configuration
#
# INSTALACIÓN:
# 1. Copiar este archivo a: /etc/nginx/conf.d/reputationmanager.conf
# 2. Reemplazar 'app.example.com' con dominio real
# 3. Verificar sintaxis: sudo nginx -t
# 4. Recargar: sudo systemctl reload nginx
#
# CERTIFICADOS:
# Antes de usar, obtener certificados Let's Encrypt:
#   sudo certbot certonly --nginx -d app.example.com -d www.app.example.com
# Ubicación: /etc/letsencrypt/live/app.example.com/

# ============================================================
# HTTP REDIRECT → HTTPS
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com www.app.example.com;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ============================================================
# HTTPS SERVER (Main)
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com www.app.example.com;

    # ========== SSL CONFIGURATION ==========
    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.example.com/chain.pem;

    # TLS Version and Ciphers (Modern Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;

    # SSL Session Cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # ========== SECURITY HEADERS ==========
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy (restrictive)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # ========== PERFORMANCE ==========
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_vary on;
    gzip_level 6;

    # ========== LOGGING ==========
    access_log /var/log/nginx/reputationmanager_access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/reputationmanager_error.log warn;

    # ========== RATE LIMITING (DDoS Protection) ==========
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=public_limit:10m rate=20r/s;

    # ========== FRONTEND (React SPA) ==========
    location / {
        root /opt/reputationmanager/app/client/dist;
        try_files $uri $uri/ /index.html;

        # Disable caching for index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Cache static assets (hashed filenames)
        location ~* \.(js|css|json|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable" always;
            add_header ETag "W/\"production\"" always;
        }
    }

    # ========== WIDGET (Public Script) ==========
    location = /widget.js {
        root /opt/reputationmanager/app/client/public;
        expires 24h;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Type "application/javascript; charset=utf-8" always;
    }

    # ========== API BACKEND (Express.js) ==========
    location /api/ {
        # Rate limiting for API
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://localhost:5005;

        # Headers forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts (match Express timeouts)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========== PUBLIC API (Higher Rate Limit) ==========
    location /api/public/ {
        # Public endpoints get higher rate limit
        limit_req zone=public_limit burst=50 nodelay;

        proxy_pass http://localhost:5005;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========== DENY DANGEROUS PATHS ==========
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /node_modules {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========== FAVICON / ROBOTS ==========
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
